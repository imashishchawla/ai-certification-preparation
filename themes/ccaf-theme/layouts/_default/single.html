{{ define "main" }}
<div class="breadcrumbs">
  <a href="{{ .Site.BaseURL }}">Home</a>
  {{ range .Ancestors }}
    <span>/</span> <a href="{{ .Permalink }}">{{ .LinkTitle }}</a>
  {{ end }}
  <span>/</span> {{ .Title }}
</div>

<article>
  <header>
    <h1>{{ .Title }}</h1>
    {{ with .Params.source_url }}
    <p class="meta">Source: <a href="{{ . }}">{{ . }}</a></p>
    {{ end }}
    {{ with .Params.tags }}
    <div class="tags">
      {{ range . }}
        <span class="tag">{{ . }}</span>
      {{ end }}
    </div>
    {{ end }}
  </header>

  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
