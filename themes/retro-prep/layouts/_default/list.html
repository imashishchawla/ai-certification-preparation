{{ define "main" }}
{{ partial "breadcrumbs.html" . }}

<h1>{{ .Title }}</h1>
<p class="muted">{{ .Description }}</p>

<div class="content">
  {{ .Content }}
</div>

{{ if .Pages }}
<div class="card-grid">
  {{ range .Pages }}
  <a href="{{ .RelPermalink }}" class="card">
    <h3>{{ .Title }}</h3>
    <p>{{ .Params.description | default (.Summary | truncate 120) }}</p>
  </a>
  {{ end }}
</div>
{{ end }}
{{ end }}
