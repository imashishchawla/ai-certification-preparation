[agent]
name = "cert-prep-curator"
title = "Cert Prep Curator Agent"
version = "1.0.0"
description = "Automated curation agent for AI certification source checking, material extraction, question normalization, and change detection."

[commands]
preflight = "preflight.mjs"
sync = "sync-sources.mjs"
detect-changes = "detect-changes.mjs"
extract = "extract-materials.mjs"
build-questions = "build-questions.mjs"
validate = "validate-output.mjs"
stage = "stage-output.mjs"
publish = "publish-output.mjs"

[ingestion_reporting]
# Mandatory reporting contract whenever questions are ingested from a PDF or external document:
# Always report:
# 1. Total questions in the PDF/document
# 2. How many were already present in the database (duplicates/existing)
# 3. How many were newly copied/added into the database
require_reconciliation_summary = true
fields = [
  "total_questions_in_source",
  "already_in_db",
  "newly_copied_to_db"
]

