baseURL = 'https://imashishchawla.github.io/ai-certification-preparation/'
title = 'AI Certification Exam Prep'
theme = 'retro-prep'
defaultContentLanguage = 'en'
enableGitInfo = false
relativeURLs = false
canonifyURLs = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'github'
    lineNos = false

[params]
  description = 'Self-contained retro preparation site for AI certification exams'
  show_toc = true

[taxonomies]
  tag = 'tags'
  category = 'categories'
