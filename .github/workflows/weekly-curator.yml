name: Weekly AI Certification Curation & Deploy

on:
  schedule:
    - cron: '0 3 * * 1' # Every Monday at 03:00 UTC
  workflow_dispatch:     # Manual run trigger

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  curate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Curator Agent Sync & Ingestion
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node .agent/cert-prep-curator/cli.mjs preflight
          node .agent/cert-prep-curator/cli.mjs dedup-db cca-f
          node .agent/cert-prep-curator/cli.mjs sync cca-f
          node .agent/cert-prep-curator/cli.mjs extract-ai cca-f
          node .agent/cert-prep-curator/cli.mjs validate cca-f

      - name: Check for Data Changes
        id: git-diff
        run: |
          if [ -n "$(git status --porcelain data/ content/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & Push Curated Updates
        if: steps.git-diff.outputs.changed == 'true'
        run: |
          git config user.name "cert-prep-curator[bot]"
          git config user.email "curator-bot@users.noreply.github.com"
          git add data/ content/
          git commit -m "chore(curator): automated weekly question bank & docs curation [skip ci]"
          git push origin main

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Build Static Site
        run: |
          hugo --minify
          node scripts/check-external-links.mjs

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
