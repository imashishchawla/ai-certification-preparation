name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:   # called by curate-certifications.yml after a successful curation run

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  # ── Preparation: verify release gates + build browser artifacts ─────────────
  prepare:
    runs-on: ubuntu-latest
    env:
      CURATOR_WORKER_URL: ${{ vars.CURATOR_WORKER_URL }}
      # STATUS_HMAC_SECRET is NOT needed here — GET /r2/release-gate is a public endpoint.
      # It IS needed in curate-certifications.yml (PUT release-gate writes must be signed).
      # Analytics IDs are public-safe beacon tokens — stored as repo Variables (not Secrets).
      GA_MEASUREMENT_ID:   ${{ vars.GA_MEASUREMENT_ID }}
      CF_ANALYTICS_TOKEN:  ${{ vars.CF_ANALYTICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify release gates
        # Skipped gracefully when CURATOR_WORKER_URL is not yet set (pre-Worker-deploy)
        if: ${{ vars.CURATOR_WORKER_URL != '' }}
        run: node scripts/verify-live-release.mjs

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Build Hugo site
        # GA_MEASUREMENT_ID and CF_ANALYTICS_TOKEN come from GitHub repo Variables (not Secrets).
        # They are public-safe beacon IDs injected into hugo.toml [params] at build time via a
        # generated override config file. If either variable is empty, its param is simply absent
        # and Hugo silently skips the analytics snippet in head.html (the {{ with }} guards fire).
        run: |
          # Write an ephemeral override config with the analytics params.
          # Use a tab-stripped heredoc (<<-) so YAML indentation doesn't leak
          # leading whitespace into the TOML keys.
          cat > /tmp/analytics.toml <<'TOMLEOF'
[params]
ga_measurement_id  = "${GA_MEASUREMENT_ID}"
cf_analytics_token = "${CF_ANALYTICS_TOKEN}"
TOMLEOF
          # Replace the shell variable placeholders now that the file is written
          sed -i "s|\${GA_MEASUREMENT_ID}|${GA_MEASUREMENT_ID}|g" /tmp/analytics.toml
          sed -i "s|\${CF_ANALYTICS_TOKEN}|${CF_ANALYTICS_TOKEN}|g" /tmp/analytics.toml
          hugo --minify \
               --baseURL "https://imashishchawla.github.io/ai-certification-preparation/" \
               --config hugo.toml,/tmp/analytics.toml

      - name: Build browser artifacts (post-Hugo shards)
        run: node scripts/build-browser-artifacts.mjs

      - name: Check external links
        run: node scripts/check-external-links.mjs

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ── Deploy: publish the uploaded artifact to GitHub Pages ───────────────────
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
