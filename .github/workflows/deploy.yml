name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:   # called by curate-certifications.yml after a successful curation run

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  # ── Preparation: verify release gates + build browser artifacts ─────────────
  prepare:
    runs-on: ubuntu-latest
    env:
      CURATOR_WORKER_URL: ${{ vars.CURATOR_WORKER_URL }}
      # STATUS_HMAC_SECRET is NOT needed here — GET /r2/release-gate is a public endpoint.
      # It IS needed in curate-certifications.yml (PUT release-gate writes must be signed).
      # Analytics IDs are public-safe beacon tokens — stored as repo Variables (not Secrets).
      GA_MEASUREMENT_ID:   ${{ vars.GA_MEASUREMENT_ID }}
      CF_ANALYTICS_TOKEN:  ${{ vars.CF_ANALYTICS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify release gates
        # Skipped gracefully when CURATOR_WORKER_URL is not yet set (pre-Worker-deploy)
        if: ${{ vars.CURATOR_WORKER_URL != '' }}
        run: node scripts/verify-live-release.mjs

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Build Hugo site
        # GA_MEASUREMENT_ID and CF_ANALYTICS_TOKEN come from GitHub repo Variables (not Secrets).
        # The Cloudflare variable may be a bare token or a dashboard-provided beacon snippet.
        # Normalize it to a token before writing TOML; never print its value in build logs.
        run: |
          node scripts/write-analytics-config.mjs /tmp/analytics.toml
          hugo --minify \
               --baseURL "https://imashishchawla.github.io/ai-certification-preparation/" \
               --config hugo.toml,/tmp/analytics.toml

      - name: Build browser artifacts (post-Hugo shards)
        run: node scripts/build-browser-artifacts.mjs

      - name: Audit rendered pages
        run: |
          node scripts/audit-rendered-pages.mjs
          node scripts/seo-spider.mjs
          node scripts/verify-site-build.mjs

      - name: Check external links
        run: node scripts/check-external-links.mjs

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ── Deploy: publish the uploaded artifact to GitHub Pages ───────────────────
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout verification script
        uses: actions/checkout@v4

      - name: Verify published site
        run: node scripts/verify-live-site.mjs
