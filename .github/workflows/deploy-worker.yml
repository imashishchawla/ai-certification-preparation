name: Deploy Cloudflare Worker

on:
  push:
    branches: [main, master]
    paths:
      - 'cloudflare/**'           # any change under cloudflare/ triggers this
  workflow_dispatch:              # manual trigger for forced redeploy

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-worker
  cancel-in-progress: true        # newer push wins — no point deploying a stale version

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    name: Deploy cert-prep-curator-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm ci
        working-directory: cloudflare/cert-prep-curator-worker

      - name: Deploy worker to Cloudflare
        run: npx wrangler deploy
        working-directory: cloudflare/cert-prep-curator-worker
        env:
          # Cloudflare API token with Workers:Edit permission
          #   Repo Secret: CLOUDFLARE_API_TOKEN
          #   Create at:   https://dash.cloudflare.com/profile/api-tokens
          #   Template:    "Edit Cloudflare Workers" (or custom with Workers:Edit + R2 Read)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Your Cloudflare account ID (visible in the right sidebar of any Workers dashboard page)
          #   Repo Variable: CLOUDFLARE_ACCOUNT_ID
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify worker health after deploy
        run: |
          WORKER_URL="https://cert-prep-curator-worker.team-revendum.workers.dev"
          echo "[deploy-worker] Checking $WORKER_URL/health ..."
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "${WORKER_URL}/health" || echo "000")
          if [ "$STATUS" != "200" ]; then
            echo "[deploy-worker] FAIL: health returned HTTP $STATUS"
            exit 1
          fi
          echo "[deploy-worker] PASS: Worker is healthy (HTTP $STATUS)"
